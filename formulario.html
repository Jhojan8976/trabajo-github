
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5568d8;
    }

    #mensaje {
      text-align: center;
      margin-top: 20px;
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <h2>Iniciar sesión</h2>

    <form id="loginForm">

      <div class="input-group">
        <label for="email">Correo electrónico</label>

        <input
          type="email"
          id="email"
          placeholder="Ingresa tu correo"
          required
        >
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>

        <input
          type="password"
          id="password"
          placeholder="Ingresa tu contraseña"
          required
        >
      </div>

      <button type="submit">
        Iniciar sesión
      </button>

      <p id="mensaje"></p>

    </form>

  </div>


  <script>

    // Datos correctos
    const correoCorrecto = "admin@ejemplo.com";
    const contrasenaCorrecta = "Admin123";

    const formulario = document.getElementById("loginForm");
    const mensaje = document.getElementById("mensaje");

    formulario.addEventListener("submit", function(event) {

      event.preventDefault();

      const correo = document.getElementById("email").value;
      const contrasena = document.getElementById("password").value;

      // Comprobar correo y contraseña
      if (
        correo === correoCorrecto &&
        contrasena === contrasenaCorrecta
      ) {

        // Ir a la página de bienvenida
        window.location.href = "bienvenido.html";

      } else {

        // Mostrar error
        mensaje.textContent = "Correo o contraseña incorrectos.";

      }

    });

  </script>

</body>
</html>
