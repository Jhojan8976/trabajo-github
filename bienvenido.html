
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .bienvenida {
      background: white;
      padding: 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #28a745;
      font-size: 40px;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="bienvenida">

    <h1>¡Bienvenido! 👋</h1>

    <p>Has iniciado sesión correctamente.</p>

  </div>

</body>
</html>
